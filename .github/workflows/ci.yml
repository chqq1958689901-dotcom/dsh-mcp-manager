name: CI

on:
  push:
    branches:
      - main
      - feat/initial-manager-core
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: npm test
